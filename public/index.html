<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mileage">
  <title>Mileage Logbook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Log trip</h1>
    <button id="logout" class="link hidden" type="button">Log out</button>
  </header>

  <main>
    <!-- Login -->
    <section id="view-login" class="view hidden">
      <form id="login-form" class="card">
        <h2>Sign in</h2>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <p class="error" id="login-error"></p>
        <button class="btn primary big" type="submit">Sign in</button>
      </form>
    </section>

    <!-- Log -->
    <section id="view-log" class="view">
      <div class="stats" id="stats"></div>
      <div id="active-trip"></div>
      <div id="new-trip"></div>
    </section>

    <!-- History -->
    <section id="view-history" class="view hidden">
      <div id="history"></div>
    </section>

    <!-- Reports -->
    <section id="view-reports" class="view hidden">
      <div class="card">
        <h2>Automatic reports</h2>
        <p class="muted">Files are created at 12:00 AM (<span id="tz"></span>):
          weekly every Monday, monthly on the 1st, quarterly on 1 Jan / Apr / Jul / Oct.</p>
        <button id="run-due" class="btn" type="button">Check for due reports now</button>
      </div>
      <form id="custom-report" class="card">
        <h2>Export a date range</h2>
        <div class="row">
          <label>From<input type="date" name="from" required></label>
          <label>To<input type="date" name="to" required></label>
        </div>
        <button class="btn primary" type="submit">Create report</button>
      </form>
      <div id="reports"></div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-view="log" class="active" type="button"><span aria-hidden="true">＋</span>Log</button>
    <button data-view="history" type="button"><span aria-hidden="true">☰</span>History</button>
    <button data-view="reports" type="button"><span aria-hidden="true">⇩</span>Reports</button>
  </nav>

  <dialog id="edit-dialog">
    <div class="dialog-head">
      <h2>Edit trip</h2>
      <button class="link" type="button" data-close>Close</button>
    </div>
    <div id="edit-form"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <datalist id="clients"></datalist>
  <script src="app.js" type="module"></script>
</body>
</html>
